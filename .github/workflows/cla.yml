name: "CLA Assistant Check"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
  issues: write # Required for reading and writing PR comments

jobs:
  CLA:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant Action"
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla-signatures.json'
          path-to-document: 'https://github.com/techpoctech/zsecureweb/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot], dependabot-preview[bot]'
